[package]
name = "classis-agent"
description = "Classis Client: the process an operator installs to place a machine under management"
# The test stubs (src/bin/stub_*.rs) are further binaries; `cargo run -p classis-agent` means this one.
# The operator tools are not here at all: they are `crates/classis-tools`.
default-run = "supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The package keeps its build-time name, the shipped binary does not. A Cargo package name never
# leaves the repository; this is the name on the host, in `ps`, and in the unit file.
[[bin]]
name = "supervisor"
path = "src/main.rs"

# Each wrapped Supervisor kind is a feature named after its `type`, all of them
# in the published build. `collector` and `command` are the core's own and always compiled in.
[features]
default = []

[dependencies]
clap.workspace = true
# The Client is an Agent upstream and a server for the Supervisor Endpoint.
opamp = { workspace = true, features = ["client", "server"] }
classis-core.workspace = true
# Service lifecycle and the content hash in the install layout's manifest.
service-manager.workspace = true
# The questionnaire `service install --interactive` and `service config` run.
dialoguer.workspace = true
sha2.workspace = true
tokio.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# The surgical `[[supervisor]]` rewrite of `supervisor.toml` keeps the operator's half of
# the file — comments, ordering, formatting — exactly as written; the questionnaire's edit of an
# existing file does the same.
toml_edit.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
hex.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
ring.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-http.workspace = true
async-trait.workspace = true
# `network` on top of the workspace's `system`: the interface enumeration behind `host.ip` and
# `host.mac`.
sysinfo = { workspace = true, features = ["network"] }
# The Supervisor Endpoint is `opamp::server`'s, an axum router; its WebSocket upgrade is
# `opamp`'s own. The HTTP engine under it — hyper, tower, http-body — is already linked
# through reqwest; this adds the routing layer.
axum.workspace = true
# A package artifact may be a `.tar.gz` or a `.7z`; the Agent unpacks it, and opens an
# encrypted `.7z` with the key from `[packages] archive_key`.
flate2.workspace = true
tar.workspace = true
sevenz-rust2.workspace = true
zip.workspace = true
# `enrol` registers with the Space's key and asks for the token (RFC 7591, RFC 6749
# section 4.4), and the Client asks again when the Server says the token is invalid.
oauth-registration = { workspace = true, features = ["client"] }
oauth-token = { workspace = true, features = ["client"] }
# The Supervisor Endpoint token and `[packages] archive_key` are held in buffers wiped on
# drop. No TLS or crypto backend comes with it.
zeroize.workspace = true

# The graceful SIGTERM → wait → kill stop of Managed Processes. Not compiled on Windows,
# which has no SIGTERM equivalent (there, kill is the stop).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The SCM runtime shim, so the daemon runs under the Windows Service Control Manager.
# Not compiled on Linux/macOS.
[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

# The native installers. Both tools read the fields above rather than restating them, and
# both package the binary the release job already built (`--no-build` / a plain `--target`), so the
# bytes in a `.deb` are the bytes in its sibling `.7z`.
#
# Neither ships a systemd unit — deliberately. `cargo-deb`'s `systemd-units` integration would write
# a second registration knowing nothing of the Client's service name or its restart policy; the
# maintainer scripts call `service install` instead, which is the one install path.
# The package carries the **product's** name, not the program's: a second
# instance is a second build, and two variants that shared a package name could not be installed
# side by side. `cargo-deb`'s `[package.metadata.deb.variants.<name>]` is the seam a variant build
# would use to override it without templating this manifest.
[package.metadata.deb]
name = "classis"
maintainer = "Markus Brigl <markus.brigl@gmail.com>"
copyright = "Copyright (c) 2026 Würth IT Italy S.r.l. Licensed under the MIT License or the Apache License, Version 2.0, at your option."
license-file = ["../../LICENSE-APACHE", "0"]
section = "admin"
priority = "optional"
extended-description = """\
The process an operator installs to place a machine under OpAMP management: it connects to a \
Server, supervises the Agents configured for this host, and can update itself and them from \
packages the Server offers.

The package delivers the binary only. `supervisor service install`, which the post-install \
runs, lays out the versioned install root and registers the systemd service."""
# Derived from what the binary actually links, rather than a floor somebody typed — and `passwd`,
# which ships the `useradd` the post-install creates the account with.
depends = "$auto, passwd"
# Always spelled `target/release/`, whatever the real target directory is: cargo-deb rewrites the
# prefix itself for a cross build, and a hand-adjusted path defeats that.
#
# `usr/libexec`, not `usr/bin`: what an operator invokes on PATH is the symlink the
# maintainer scripts lay through the layout's `current` pointer, so the CLI always answers for the
# binary the service runs. The payload itself stays off PATH.
#
# A directory named after the product, holding a file named after the program: two variant builds
# ship the same program under different products, so a bare
# `usr/libexec/supervisor` would be one file two packages both claim to own.
assets = [["target/release/supervisor", "usr/libexec/classis/", "755"]]
maintainer-scripts = "../../packaging/linux"

[package.metadata.generate-rpm]
name = "classis"
# One `Release`, forever: a version is released once, so there is never a second build of one.
release = "1"
assets = [
    { source = "target/release/supervisor", dest = "/usr/libexec/classis/supervisor", mode = "755" },
]
# These resolve against this manifest's directory. A path that does *not* resolve is silently
# taken as the scriptlet body itself — so the release job asserts with `rpm -qp --scripts` that what
# landed in the package is the script and not its file name.
#
# `%posttrans` re-lays the `/usr/bin` symlink: on an upgrade, rpm erases the *old*
# package's files after the new `%post` has run, which deletes the link `%post` just created — the
# transaction scriptlet runs after that erasure, so its link is the one that survives.
post_install_script = "../../packaging/linux/postinst"
pre_uninstall_script = "../../packaging/linux/prerm"
post_uninstall_script = "../../packaging/linux/postrm"
post_trans_script = "../../packaging/linux/posttrans"

# The post-install creates the account `classis` with `useradd`. A file
# dependency, because the package that ships it is `shadow-utils` on Fedora and RHEL and `shadow`
# on SUSE. cargo-generate-rpm writes a plain `Requires:`; it has no `Requires(post):` form.
[package.metadata.generate-rpm.requires]
"/usr/sbin/useradd" = "*"

[dev-dependencies]
# A test Package Root and Package Signers.
classis-core = { workspace = true, features = ["test-support"] }
# Virtual time, so a bound measured in minutes is tested in milliseconds.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
# A test reads the process account back from a plist as `service-manager` writes it,
# through the crate it writes with.
plist = "1"
# Tests build the `.7z` fixtures they then open; the daemon itself only ever decompresses. The
# encoder rides here alone, since `pack` lives in its own crate — a dev-dependency
# reaches the tests and no shipped binary.
sevenz-rust2 = { workspace = true, features = ["compress"] }
# The interop test makes the CA and the Server certificate it serves TLS with.
rcgen.workspace = true
# The end-to-end test runs the real Server in-process against the real Client binary,
# which it admits by the bearer token the Server issued it: no test serves the Agent plane
# without admission.
classis-server = { path = "../classis-server" }
