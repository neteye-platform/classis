[package]
name = "classis-server"
description = "Classis Server: dual-transport OpAMP endpoint, REST API, and bundled UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The program keeps its name; the package's is a build-time identifier.
[[bin]]
name = "server"
path = "src/main.rs"

[features]
# `agent_app_open_for_tests` and `agent_app_admitted_as_for_tests`: the Agent plane without
# admission. Enabled by the tests of this crate, through its own dev-dependency, and until the
# certificate cleanup by those of `classis-agent`; never by a build of the Server.
test-support = []

[dependencies]
opamp = { workspace = true, features = ["server"] }
classis-core.workspace = true
# `secret::generate` and `secret::hash`: the one generator of the enrolment key's secret, and of
# what a client keeps hashes of; the `server` halves are the routes
# `/v1/enrol` and `/v1/token` and the reading of a Bearer credential at admission.
oauth-token = { workspace = true, features = ["server"] }
oauth-registration = { workspace = true, features = ["server"] }
# Streaming a stored package artifact into the response body — the same workspace
# dependency the Client already builds on, promoted from dev-only.
futures-util.workspace = true
tokio.workspace = true
axum.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
ring.workspace = true
argon2.workspace = true
libc.workspace = true
base64.workspace = true
constant_time_eq.workspace = true
# Reading when a certificate the Server depends on ends. `verify` and `rcgen` serve only
# the unwired certificate modules (`ca`, `bootstrap`, `revocation`) until the certificate cleanup
# removes them.
x509-parser = { workspace = true, features = ["verify"] }
rcgen.workspace = true
# The TLS 1.3 client configuration of the S3 store and of PostgreSQL: the
# Server terminates no TLS of its own.
rustls.workspace = true
time.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
# The S3 store of artifact bytes: the client, and the HTTP client it is handed, built on
# the TLS 1.3 *ring* configuration of `opamp::tls` and the public roots the Client trusts. The
# Server sends no request for a package to anyone but its own bucket.
object_store.workspace = true
reqwest.workspace = true
webpki-roots.workspace = true
# The record store in PostgreSQL, over the same TLS 1.3 *ring* client.
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
# The Server's private key and a Basic password before it is verified are held in buffers
# wiped on drop. No TLS or crypto backend comes with it.
zeroize.workspace = true

[dev-dependencies]
# A test Package Root and Package Signers.
classis-core = { workspace = true, features = ["test-support"] }
# The integration tests of this crate enable its own `test-support` feature.
classis-server = { path = ".", features = ["test-support"] }
flate2.workspace = true
tokio-tungstenite.workspace = true
# The two OAuth clients enrol a host and ask for its token in the tests of `/v1/enrol` and
# `/v1/token`.
oauth-token = { workspace = true, features = ["client"] }
oauth-registration = { workspace = true, features = ["client"] }
tempfile = "3"
