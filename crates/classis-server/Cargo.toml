[package]
name = "classis-server"
description = "Classis Server: dual-transport OpAMP endpoint, REST API, and bundled UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The program keeps its name; the package's is a build-time identifier.
[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
opamp = { workspace = true, features = ["server"] }
classis-core.workspace = true
# `secret::generate` and `secret::hash`: the one generator of the enrolment key's secret, and of
# what a client keeps hashes of.
oauth-token.workspace = true
# Streaming a stored package artifact into the response body — the same workspace
# dependency the Client already builds on, promoted from dev-only.
futures-util.workspace = true
tokio.workspace = true
axum.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
ring.workspace = true
argon2.workspace = true
libc.workspace = true
flate2.workspace = true
base64.workspace = true
constant_time_eq.workspace = true
# Which CA issued the certificate a connection carries — the client CA's member, or the
# bootstrap CA's enrolling host. The parser rcgen itself uses, already in the tree.
x509-parser = { workspace = true, features = ["verify"] }
# The TLS 1.3 client configuration of the S3 store and of PostgreSQL: the
# Server terminates no TLS of its own.
rustls.workspace = true
rcgen.workspace = true
time.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
# The S3 store of artifact bytes: the client, and the HTTP client it is handed, built on
# the TLS 1.3 *ring* configuration of `opamp::tls` and the public roots the Client trusts. The
# Server sends no request for a package to anyone but its own bucket.
object_store.workspace = true
reqwest.workspace = true
webpki-roots.workspace = true
# The record store in PostgreSQL, over the same TLS 1.3 *ring* client.
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
# The CA keys, the keys sealed into a PKCS#12 file, a bootstrap password and a Basic
# password before it is verified are held in buffers wiped on drop. No TLS or crypto backend comes
# with it.
zeroize.workspace = true

[dev-dependencies]
# A test Package Root and Package Signers.
classis-core = { workspace = true, features = ["test-support"] }
tokio-tungstenite.workspace = true
tempfile = "3"
