[package]
name = "classis-tools"
description = "classisctl, the Classis operator tool: package artifacts and the server's certificates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One binary, `classisctl`, and no library: nothing in this workspace depends on this crate —
# the arrow points the other way.
[[bin]]
name = "classisctl"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The ring provider every binary installs at startup.
opamp = { workspace = true, features = ["client"] }
# The Client's own `archive` — its 7z Unix-mode convention, used when packing, and its
# unpackers, used by the tests to open what these tools produce. Checking an artifact against the
# code that will install it is the property worth asserting, and it is why these tools live in the
# same workspace as the Client rather than beside it.
classis-agent = { path = "../classis-agent" }
classis-core.workspace = true
# `pack` writes the containers a Client can open, so it needs the *writers* — `compress`
# for 7z, and the gzip/tar pair for `.tar.gz` and for the tree `classisctl package fetch`
# repacks.
sevenz-rust2 = { workspace = true, features = ["compress"] }
flate2.workspace = true
tar.workspace = true
# `keygen`/`sign` make raw Ed25519 signatures over a Package's statement, which the Client and the
# Server now refuse.
ring.workspace = true
sha2.workspace = true
# Every hash, key, and signature these tools print is hex — the form the REST API and
# `supervisor.toml` take them in.
hex.workspace = true
# `classisctl package fetch` asks which agent, which version, and which platforms. The
# Client needs the same crate for its interactive install, so this is one workspace
# dependency serving two crates rather than a second prompt library.
dialoguer.workspace = true
# The `pki` commands make the server CA and the server certificates with rcgen, on the
# dates `time` speaks, and read a certificate's end back with x509-parser.
rcgen.workspace = true
time.workspace = true
x509-parser.workspace = true
# The paths the fragments name, quoted as TOML strings.
toml.workspace = true
# Listing releases and downloading artifacts. TLS is rustls/ring, as everywhere — the
# provider is installed at startup through the Client's own helper, since `rustls-no-provider`
# refuses to build a client without one.
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
serde_json.workspace = true
# The signing file is read strictly — unknown fields refused — which derive states in
# one line per type rather than in hand-written checks over a `serde_json::Value`.
serde.workspace = true
# The keys these tools read and write are held in buffers wiped on drop.
# No TLS or crypto backend comes with it.
zeroize.workspace = true

[dev-dependencies]
# A test Package Root and Package Signers.
classis-core = { workspace = true, features = ["test-support"] }
tempfile = "3"
# The end-to-end test runs the real Server, and the real Client's `enrol`, in-process on
# what `pki init` wrote, reading the fragments as their configuration files are read.
classis-server = { path = "../classis-server" }
