[package]
name = "classis-core"
description = "What the Server and the Client of Classis implement identically, beyond the protocol (ADR-0010)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `package::testing`: a test Package Root and Package Signers. For tests only; it makes nothing
# trusted by itself (ADR-0063).
test-support = ["dep:ring", "dep:time"]

[build-dependencies]
# Resolving the baked version from the repository's tags (ADR-0012). A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true

[dependencies]
# The bootstrap certificate as a password-protected PKCS#12 file, written by the Server and read by
# the Client (ADR-0029): `pkcs12`, `pkcs5` and `der` read which schemes a file uses; `rcgen` and
# `x509-parser` tell whether the key and the certificate belong together.
p12-keystore.workspace = true
pkcs12.workspace = true
pkcs5.workspace = true
der.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
# The host a certificate that names none is taken for, on the Server and on a Gateway alike
# (ADR-0039): the SHA-256 of its issuer and serial.
sha2.workspace = true
hex.workspace = true
# A Package signature is a Package Signer's certificate and its Ed25519 signature, verified up to a
# compiled-in Package Root (ADR-0063).
rustls-webpki.workspace = true
rustls-pki-types.workspace = true
# A test Package Root and Package Signers for the tests of every crate (`package::testing`).
ring = { workspace = true, optional = true }
time = { workspace = true, optional = true }
# The key a `bootstrap.p12` opens to is held in a buffer wiped on drop (ADR-0057). No TLS or
# crypto backend comes with it (ADR-0013).
zeroize.workspace = true

[dev-dependencies]
ring.workspace = true
time.workspace = true
