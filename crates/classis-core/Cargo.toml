[package]
name = "classis-core"
description = "What the Server and the Client of Classis implement identically, beyond the protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `package::testing`: a test Package Root and Package Signers. For tests only; it makes nothing
# trusted by itself.
test-support = ["dep:ring", "dep:time"]

[build-dependencies]
# Resolving the baked version from the repository's tags. A build dependency only: it is
# linked into no artifact, and it sits here rather than in each binary so that both ends report a
# version computed by one implementation.
git2.workspace = true

[dependencies]
# A test Package Root and Package Signers (`package::testing`) are made with `rcgen`.
rcgen.workspace = true
sha2.workspace = true
hex.workspace = true
# A Package signature is a Package Signer's certificate and its Ed25519 signature, verified up to a
# compiled-in Package Root.
rustls-webpki.workspace = true
rustls-pki-types.workspace = true
# A test Package Root and Package Signers for the tests of every crate (`package::testing`).
ring = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
ring.workspace = true
time.workspace = true
tempfile = "3"
