# cargo-deny: the supply-chain gate (specification Q-3). README → "Build, Test & Run" runs it; the
# security workflow runs it on every dependency change and weekly.
#
# Four checks, each failing the build: a known vulnerability, a licence outside the list below, a
# crate from anywhere but crates.io, and a crate this project has decided never to link.

[graph]
all-features = true

[advisories]
# Every advisory fails, the unmaintained and unsound kinds included, except those reviewed in
# `ignore`. A new advisory against an ignored crate carries a new id and fails again. An ignore that
# matches nothing fails the run that does not see it: audit.yml checks Cargo.lock and
# fuzz/Cargo.lock against this one file, so an ignore here must match in both lockfiles.
unmaintained = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
# Permissive licences only. A crate offering several licences passes when one of them is here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# libFuzzer itself is LLVM's, under the permissive NCSA licence. It is linked into the fuzz targets
# only, never into a shipped binary.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates depend on each other by path; only unpublished crates may, so a path
# never reaches crates.io as a wildcard.
allow-wildcard-paths = true
# The TLS stack is rustls on ring and nothing else (ADR-0013): no system OpenSSL, and no aws-lc,
# whose cmake and C build this project keeps out.
deny = [
    { name = "openssl", reason = "TLS is rustls on ring (ADR-0013)" },
    { name = "openssl-sys", reason = "TLS is rustls on ring (ADR-0013)" },
    { name = "native-tls", reason = "TLS is rustls on ring (ADR-0013)" },
    { name = "aws-lc-rs", reason = "TLS is rustls on ring (ADR-0013)" },
    { name = "aws-lc-sys", reason = "TLS is rustls on ring (ADR-0013)" },
    # The bootstrap PKCS#12 file is PBES2 with AES only (ADR-0029); `p12-keystore`'s `pbes1`
    # feature, which would link these, stays off.
    { name = "rc2", reason = "no legacy PKCS#12 scheme (ADR-0029)" },
    { name = "des", reason = "no legacy PKCS#12 scheme (ADR-0029)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
