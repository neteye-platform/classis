# Minimal test Configuration for the "otelcol" supervisor example in config/supervisor.toml —
# the core otelcol distribution, no opampextension: the Supervisor observes it from the outside.
# Distributed by scripts/seed_test_configs.sh as Configuration "otelcol-conf".
# Ports are offset so it can run alongside the otelcol-contrib collector on the same host.

receivers:
  otlp:
    protocols:
      http:
        # Same variable as in the otelcol-contrib example, its own value per supervisor —
        # that is what [supervisor.env] is for; the value after :- is the fallback.
        endpoint: ${env:OTLP_HTTP_ENDPOINT:-127.0.0.1:14318}

exporters:
  debug: {}

service:
  telemetry:
    metrics:
      level: none # no internal-metrics listener
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
