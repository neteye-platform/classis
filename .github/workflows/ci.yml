name: CI

# What the Definition of Done (AGENTS.md §5) asks beyond Linux, on the stack of ADR-0010: the
# Client checked and tested on Windows and macOS, and release builds of the Client on every
# platform it ships on — Linux, Windows, and macOS — and of the Server on Linux only
# (docs/SPECIFICATION.md). Build, test and lint on Linux are the 'rust' job of checks.yml, which
# runs scripts/check-rust.sh as the local gate does. The commands MUST match README.md →
# "Build, Test & Run", the single source of truth.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ADR-0019: the client carries platform-specific service paths (the Windows SCM shim, launchd
  # semantics) that a Linux-only lint never compiles. Keep them honest: clippy and tests on the
  # real platforms. Actual service registration still needs the manual smoke checklist
  # (README.md → "Running as an OS service") — CI runners cannot exercise systemd/launchd/SCM.
  #
  # Both are required status checks (README.md → "Repository settings"). A ruleset names a check
  # by the job's rendered name, so these two are plain jobs without a 'name:' or a matrix: the
  # check is then called by the job id, which scripts/check-docs.sh compares with the README.
  # classis-tools too: the release packs every Client archive with `classisctl`, Windows
  # included, and publishes it for macOS (ADR-0028).
  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy -p classis-agent -p classis-tools --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p classis-agent --locked

  client-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy -p classis-agent -p classis-tools --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p classis-agent --locked

  # ADR-0049 clause 9: the S3 store's tests, which a plain `cargo test` skips, run here against a
  # rustfs service, its image pinned by digest. The key pair is the throwaway one of this job's
  # own container, not a secret. The tests make a prefix of their own and leave the bucket empty.
  s3-store:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: fleet-ci
          RUSTFS_SECRET_KEY: fleet-ci-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create the bucket
        # The Server creates none (ADR-0049 clause 4). curl signs the request itself; the service
        # may still be starting, so the first attempts are allowed to fail.
        run: |
          empty="$(printf '' | sha256sum | cut -d' ' -f1)"
          for _ in $(seq 1 30); do
            if curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user fleet-ci:fleet-ci-secret \
                -H "x-amz-content-sha256: $empty" -X PUT http://127.0.0.1:9000/fleet; then
              exit 0
            fi
            sleep 2
          done
          echo "rustfs did not create the bucket" >&2
          exit 1
      - name: Test against rustfs
        env:
          CLASSIS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          CLASSIS_TEST_S3_BUCKET: fleet
          CLASSIS_TEST_S3_ACCESS_KEY_ID: fleet-ci
          CLASSIS_TEST_S3_SECRET_ACCESS_KEY_FILE: ${{ runner.temp }}/s3-secret
        run: |
          set -euo pipefail
          (umask 077 && printf '%s' fleet-ci-secret > "$CLASSIS_TEST_S3_SECRET_ACCESS_KEY_FILE")
          cargo test -p classis-server --lib --locked s3:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/s3.log"
          # Skipped is not passed: the store was named, so every S3 test must have reached it.
          if grep -q "skipped: no S3 store" "$RUNNER_TEMP/s3.log"; then
            echo "an S3 test was skipped although a store is named" >&2
            exit 1
          fi

  postgres-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start PostgreSQL with TLS
        # The connection the Server makes: TLS 1.3, the database's certificate verified against
        # the CA made here and its name checked (ADR-0050 clause 7). Started by `docker run`
        # rather than as a service, so that it starts after its certificate is made.
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$certs"
          cd "$certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj "/CN=fleet CI database CA" -keyout ca.key -out ca.pem
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -subj "/CN=localhost" -keyout server.key -out server.csr
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile ext.cnf -out server.pem
          # PostgreSQL reads its key only when the server's account owns it, alone.
          sudo chown 999:999 server.key server.pem
          sudo chmod 600 server.key
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=fleet -e POSTGRES_PASSWORD=fleet-ci -e POSTGRES_DB=fleet \
            -v "$certs/server.pem:/tls/server.pem:ro" -v "$certs/server.key:/tls/server.key:ro" \
            postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key \
            -c ssl_min_protocol_version=TLSv1.3
          for _ in $(seq 1 60); do
            if docker exec postgres pg_isready --host 127.0.0.1 --username fleet --dbname fleet; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres >&2
          exit 1
      - name: Test against PostgreSQL
        # Over TLS against the CA above; each test works in a schema of its own (clause 16).
        env:
          CLASSIS_TEST_POSTGRES_HOST: 127.0.0.1
          CLASSIS_TEST_POSTGRES_PORT: "5432"
          CLASSIS_TEST_POSTGRES_DBNAME: fleet
          CLASSIS_TEST_POSTGRES_USER: fleet
          CLASSIS_TEST_POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/postgres-password
          CLASSIS_TEST_POSTGRES_CA_FILE: ${{ runner.temp }}/postgres-tls/ca.pem
        run: |
          set -euo pipefail
          (umask 077 && printf '%s' fleet-ci > "$CLASSIS_TEST_POSTGRES_PASSWORD_FILE")
          cargo test -p classis-server --lib --locked postgres:: -- --nocapture 2>&1 | tee "$RUNNER_TEMP/postgres.log"
          # Skipped is not passed: the database was named, so every PostgreSQL test must have
          # reached it.
          if grep -q "skipped: no PostgreSQL" "$RUNNER_TEMP/postgres.log"; then
            echo "a PostgreSQL test was skipped although a database is named" >&2
            exit 1
          fi

  # The Client ships on Linux, macOS, and Windows; the Server on Linux only.
  release-build:
    name: release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-linux, os: ubuntu-latest, package: classis-agent, binary: target/release/supervisor }
          - { name: client-windows, os: windows-latest, package: classis-agent, binary: target/release/supervisor.exe }
          - { name: client-macos, os: macos-latest, package: classis-agent, binary: target/release/supervisor }
          - { name: server-linux, os: ubuntu-latest, package: classis-server, binary: target/release/server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (release)
        run: cargo build -p ${{ matrix.package }} --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
